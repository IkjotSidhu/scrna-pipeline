project: DR26001-pilot
samples: samples.csv
output: ../pipeline-results
seed: 26001
workers: 1
future_max_gb: 28

# Pilot thresholds chosen after inspecting the unfiltered distributions.
# They remain reviewable settings, not universal gut thresholds.
qc:
  preliminary_min_features: 50
  min_counts: 500
  min_features: 200
  max_features: 10000
  max_mt_percent: 25

ambient:
  method: auto

doublets:
  method: scDblFinder
  expected_rate: 0

analysis:
  nfeatures: 2000
  npcs: 30
  resolution: 0.5
  neighbors: 20
  umap_neighbors: 30

integration:
  # No batch effect is expected in this pilot, so retain the baseline analysis.
  enabled: false
  method: harmony
  batch_variable: capture_id

# Keep this pilot focused on preprocessing behavior. Marker discovery will be
# enabled only after QC, ambient correction, and doublet calls are reviewed.
markers:
  enabled: false
  min_pct: 0.1
  logfc_threshold: 0.25
