project: public-mouse-tissue-benchmarks
samples: samples.csv
output: ../results
seed: 142471
workers: 1
future_max_gb: 28
qc:
  preliminary_min_features: 50
  min_counts: 500
  min_features: 200
  high_features_review: 10000
  max_mt_percent: 25
ambient:
  method: auto
doublets:
