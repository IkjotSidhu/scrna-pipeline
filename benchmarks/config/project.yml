  expected_rate: 0
analysis:
  nfeatures: 2000
  npcs: 30
  resolution: 0.5
  neighbors: 20
  umap_neighbors: 30
integration:
  enabled: auto
  method: harmony
  batch_variable: batch_id
markers:
  enabled: false
  min_pct: 0.1
  logfc_threshold: 0.25
